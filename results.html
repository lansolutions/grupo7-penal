<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados ao Vivo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0a1628;font-family:'Segoe UI',sans-serif;color:#f1f5f9;overflow:hidden}
.wrap{width:100%;height:100%;overflow:hidden;padding:12px;display:flex;flex-direction:column;gap:10px}
.aguarda{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#475569;gap:10px}
.aguarda .icon{font-size:2rem;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.rcard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:12px 14px;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
.tipo-badge{font-size:.55rem;letter-spacing:3px;text-transform:uppercase;color:#7a9bbf;margin-bottom:4px}
.ptxt{font-size:.8rem;font-weight:600;color:#f1f5f9;line-height:1.3;margin-bottom:8px}
.votos{font-size:.6rem;color:#475569;margin-bottom:8px}
/* word cloud */
.wc-wrap{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;flex:1;overflow:hidden}
.wc-word{padding:3px 9px;border-radius:16px;background:rgba(232,184,75,.1);border:1px solid rgba(232,184,75,.2);color:#e8b84b;font-weight:600}
/* barras */
.bar-item{margin-bottom:7px}
.bar-label{display:flex;justify-content:space-between;font-size:.7rem;color:#cbd5e1;margin-bottom:3px}
.bar-track{height:14px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(to right,#e8b84b,#4e9af1);transition:width .6s ease}
/* escala */
.scale-display{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;justify-content:center;min-height:0}
.scale-num{font-size:2.2rem;font-weight:900;color:#e8b84b}
.scale-sub{font-size:.62rem;color:#7a9bbf;text-align:center}
.scale-mini-bars{display:flex;gap:5px;align-items:flex-end;height:40px}
.smb{width:26px;border-radius:3px 3px 0 0;background:rgba(232,184,75,.25);transition:height .5s;position:relative;min-height:4px}
.smb.active{background:#e8b84b}
.smb-lbl{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:.55rem;color:#7a9bbf}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="aguarda"><div class="icon">📊</div><p style="font-size:.8rem">Aguardando perguntas ativas...</p></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCcpZjXuHspxtWU5uibac7BjB9J-ye6bOk",
  authDomain: "penalgrupo7.firebaseapp.com",
  databaseURL: "https://penalgrupo7-default-rtdb.firebaseio.com",
  projectId: "penalgrupo7",
  storageBucket: "penalgrupo7.firebasestorage.app",
  messagingSenderId: "1018506558021",
  appId: "1:1018506558021:web:d8cb6a323d5eb23aee012c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const wrapEl = document.getElementById("wrap");
let perguntas = {}, ativas = {}, respostas = {};

onValue(ref(db, "perguntas"), s => { perguntas = s.val()||{}; render(); });
onValue(ref(db, "ativas"), s => { ativas = s.val()||{}; render(); });
onValue(ref(db, "respostas"), s => { respostas = s.val()||{}; render(); });

function render() {
  const ids = Object.keys(ativas).filter(id => perguntas[id]);
  if (!ids.length) {
    wrapEl.innerHTML = `<div class="aguarda"><div class="icon">📊</div><p style="font-size:.8rem">Aguardando perguntas ativas...</p></div>`;
    return;
  }
  wrapEl.innerHTML = ids.map(id => renderCard(id)).join("");
}

function renderCard(id) {
  const p = perguntas[id];
  const raw = respostas[id] ? Object.values(respostas[id]).map(r => r.valor) : [];
  const total = raw.length;
  let corpo = "";

  if (p.tipo === "wordcloud") {
    const freq = {};
    raw.forEach(r => { const w = String(r).trim().toLowerCase(); if(w) freq[w]=(freq[w]||0)+1; });
    const sorted = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,20);
    const max = sorted[0]?.[1]||1;
    corpo = `<div class="wc-wrap">${sorted.map(([w,c])=>`<span class="wc-word" style="font-size:${0.7+c/max*0.7}rem">${w}${c>1?` <small style="opacity:.6">${c}</small>`:""}</span>`).join("")}</div>`;
  } else if (p.tipo === "enquete") {
    const opts = p.opcoes||[];
    const counts = opts.map((_,i)=>raw.filter(r=>String(r)===String(i)).length);
    corpo = opts.map((o,i)=>{
      const pct = total?Math.round(counts[i]/total*100):0;
      return `<div class="bar-item"><div class="bar-label"><span>${o}</span><span>${counts[i]} (${pct}%)</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div></div>`;
    }).join("");
  } else if (p.tipo === "escala") {
    const nums = raw.map(r=>Number(r)).filter(n=>n>=1&&n<=5);
    const media = nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(1):"–";
    const counts = [1,2,3,4,5].map(v=>nums.filter(n=>n===v).length);
    const maxC = Math.max(...counts,1);
    corpo = `<div class="scale-display">
      <div class="scale-num">${media}<span style="font-size:1rem;color:#7a9bbf">/5</span></div>
      <div class="scale-sub">${p.min_label||"Discordo"} ←→ ${p.max_label||"Concordo"}</div>
      <div class="scale-mini-bars">${counts.map((c,i)=>`<div class="smb ${c===maxC&&c>0?"active":""}" style="height:${Math.max(4,c/maxC*38)}px"><span class="smb-lbl">${i+1}</span></div>`).join("")}</div>
    </div>`;
  }

  return `<div class="rcard">
    <div class="tipo-badge">${tipoLabel(p.tipo)}</div>
    <div class="ptxt">${p.texto}</div>
    <div class="votos">${total} resposta${total!==1?"s":""}</div>
    ${corpo}
  </div>`;
}

function tipoLabel(t){return{wordcloud:"☁️ Nuvem",enquete:"⚖️ Enquete",escala:"🌡️ Termômetro"}[t]||t;}
</script>
</body>
</html>
