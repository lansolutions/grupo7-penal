<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Admin — Extinção da Punibilidade</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#0a1628;font-family:'Segoe UI',sans-serif;color:#f1f5f9}
.wrap{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:1rem;color:#e8b84b;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.sub{font-size:.7rem;color:#475569;margin-bottom:20px}
.section{margin-bottom:28px}
.section-title{font-size:.65rem;letter-spacing:3px;text-transform:uppercase;color:#7a9bbf;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:6px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:16px;margin-bottom:12px}
label{font-size:.75rem;color:#94a3b8;display:block;margin-bottom:5px;margin-top:10px}
input,select,textarea{width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:8px;padding:10px 12px;font-size:.85rem;color:#f1f5f9;outline:none}
input:focus,select:focus,textarea:focus{border-color:#e8b84b}
textarea{resize:vertical;min-height:60px}
select option{background:#0a1628}
.btn{padding:11px 20px;border:none;border-radius:9px;font-size:.85rem;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-gold{background:linear-gradient(135deg,#e8b84b,#d4a832);color:#0a1628;width:100%;margin-top:12px}
.btn-ativar{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#86efac;flex:1;padding:8px 12px;font-size:.78rem;border-radius:8px;cursor:pointer}
.btn-ativar.ativo{background:rgba(34,197,94,.3);border-color:#22c55e}
.btn-del{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fca5a5;padding:8px 14px;font-size:.75rem;border-radius:8px;cursor:pointer}
.btn-reset{background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.25);color:#fdba74;padding:8px 14px;font-size:.75rem;border-radius:8px;cursor:pointer}
.pcard{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;margin-bottom:10px}
.pcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.pcard-txt{font-size:.82rem;color:#f1f5f9;line-height:1.4;flex:1}
.pcard-tipo{font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:#7a9bbf;margin-top:3px}
.pcard-actions{display:flex;gap:8px;align-items:center}
.ativo-badge{font-size:.62rem;background:rgba(34,197,94,.2);color:#86efac;border-radius:20px;padding:3px 10px;border:1px solid rgba(34,197,94,.3)}
.nenhuma{text-align:center;padding:20px;font-size:.8rem;color:#475569}
.opts-container{margin-top:8px}
.opt-row{display:flex;gap:8px;margin-bottom:6px}
.opt-row input{flex:1}
.btn-addopt{background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.2);border-radius:8px;padding:8px;font-size:.75rem;color:#7a9bbf;cursor:pointer;width:100%;margin-top:4px}
.desativar-wrap{text-align:center;margin-bottom:16px}
.btn-desativar{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:10px 24px;border-radius:10px;font-size:.82rem;font-weight:600;cursor:pointer}
.ativas-count{font-size:.7rem;color:#86efac;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);border-radius:20px;padding:3px 12px;display:inline-block;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>⚙️ Painel Admin</h1>
  <p class="sub">Extinção da Punibilidade · Grupo 7</p>

  <div class="desativar-wrap">
    <button class="btn-desativar" onclick="desativarTodas()">⏹ Desativar todas</button>
  </div>

  <div class="section">
    <div class="section-title">Perguntas cadastradas</div>
    <div id="ativas-info"></div>
    <div id="lista-perguntas"><div class="nenhuma">Carregando...</div></div>
  </div>

  <div class="section">
    <div class="section-title">Cadastrar nova pergunta</div>
    <div class="card">
      <label>Tipo</label>
      <select id="tipo" onchange="renderOpcoes()">
        <option value="wordcloud">☁️ Nuvem de Palavras</option>
        <option value="enquete">⚖️ Enquete (múltipla escolha)</option>
        <option value="escala">🌡️ Termômetro (escala 1–5)</option>
      </select>
      <label>Texto da pergunta</label>
      <textarea id="texto" placeholder="Digite a pergunta..."></textarea>
      <div id="extras"></div>
      <button class="btn btn-gold" onclick="cadastrar()">+ Cadastrar pergunta</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCcpZjXuHspxtWU5uibac7BjB9J-ye6bOk",
  authDomain: "penalgrupo7.firebaseapp.com",
  databaseURL: "https://penalgrupo7-default-rtdb.firebaseio.com",
  projectId: "penalgrupo7",
  storageBucket: "penalgrupo7.firebasestorage.app",
  messagingSenderId: "1018506558021",
  appId: "1:1018506558021:web:d8cb6a323d5eb23aee012c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
let perguntas = {};
let ativas = {};  // agora é um objeto com múltiplos IDs

onValue(ref(db, "perguntas"), (snap) => { perguntas = snap.val() || {}; renderLista(); });
onValue(ref(db, "ativas"), (snap) => { ativas = snap.val() || {}; renderLista(); });

function renderLista() {
  const el = document.getElementById("lista-perguntas");
  const infoEl = document.getElementById("ativas-info");
  const ids = Object.keys(perguntas);
  const nAtivas = Object.keys(ativas).length;
  infoEl.innerHTML = nAtivas > 0
    ? `<div class="ativas-count">✅ ${nAtivas} pergunta${nAtivas>1?"s":""} ativa${nAtivas>1?"s":""} agora</div>`
    : '';
  if (!ids.length) { el.innerHTML = `<div class="nenhuma">Nenhuma pergunta cadastrada.</div>`; return; }
  el.innerHTML = ids.map(id => {
    const p = perguntas[id];
    const isAtiva = !!ativas[id];
    return `<div class="pcard">
      <div class="pcard-top">
        <div><div class="pcard-txt">${p.texto}</div><div class="pcard-tipo">${tipoLabel(p.tipo)}</div></div>
        <button class="btn-del" onclick="resetar('${id}')">🔄 Resetar</button>
        <button class="btn-del" onclick="deletar('${id}')">🗑</button>
      </div>
      <div class="pcard-actions">
        <button class="btn-ativar ${isAtiva?"ativo":""}" onclick="toggleAtiva('${id}')">
          ${isAtiva ? "✅ Ativa — clique p/ desativar" : "▶ Ativar"}
        </button>
        ${isAtiva ? `<span class="ativo-badge">AO VIVO</span>` : ""}
      </div>
    </div>`;
  }).join("");
}

window.toggleAtiva = async (id) => {
  if (ativas[id]) {
    await remove(ref(db, "ativas/" + id));
  } else {
    await set(ref(db, "ativas/" + id), true);
  }
};

window.desativarTodas = async () => { await set(ref(db, "ativas"), null); };

window.deletar = async (id) => {
  if (!confirm("Deletar esta pergunta?")) return;
  await remove(ref(db, "perguntas/" + id));
  await remove(ref(db, "respostas/" + id));
  await remove(ref(db, "ativas/" + id));
};

window.resetar = async (id) => {
  if (!confirm("Limpar todas as respostas desta pergunta?\nA pergunta não será excluída.")) return;
  await remove(ref(db, "respostas/" + id));
  alert("✅ Respostas resetadas!");
};

window.cadastrar = async () => {
  try {
    const tipo = document.getElementById("tipo").value;
    const texto = document.getElementById("texto").value.trim();
    if (!texto) { alert("Digite o texto da pergunta."); return; }
    const dados = { tipo, texto };
    if (tipo === "enquete") {
      const inputs = document.querySelectorAll(".opt-input");
      const opcoes = [...inputs].map(i => i.value.trim()).filter(Boolean);
      if (opcoes.length < 2) { alert("Adicione pelo menos 2 opções."); return; }
      dados.opcoes = opcoes;
    }
    if (tipo === "escala") {
      dados.min_label = document.getElementById("min_label").value || "Discordo totalmente";
      dados.max_label = document.getElementById("max_label").value || "Concordo totalmente";
    }
    await push(ref(db, "perguntas"), dados);
    document.getElementById("texto").value = "";
    renderOpcoes();
    alert("✅ Pergunta cadastrada!");
  } catch(e) { alert("❌ Erro: " + e.message); }
};

window.renderOpcoes = function() {
  const tipo = document.getElementById("tipo").value;
  const el = document.getElementById("extras");
  if (tipo === "enquete") {
    el.innerHTML = `<label>Opções de resposta</label>
      <div class="opts-container" id="opts-container">
        <div class="opt-row"><input class="opt-input" placeholder="Opção 1"></div>
        <div class="opt-row"><input class="opt-input" placeholder="Opção 2"></div>
      </div>
      <button class="btn-addopt" onclick="addOpt()">+ Adicionar opção</button>`;
  } else if (tipo === "escala") {
    el.innerHTML = `<label>Rótulo esquerda</label><input id="min_label" placeholder="Discordo totalmente">
      <label>Rótulo direita</label><input id="max_label" placeholder="Concordo totalmente">`;
  } else { el.innerHTML = ""; }
};

window.addOpt = function() {
  const c = document.getElementById("opts-container");
  const div = document.createElement("div"); div.className = "opt-row";
  div.innerHTML = `<input class="opt-input" placeholder="Opção ${c.children.length+1}">`;
  c.appendChild(div);
};

function tipoLabel(t) {
  return {wordcloud:"☁️ Nuvem de palavras",enquete:"⚖️ Enquete",escala:"🌡️ Termômetro"}[t]||t;
}
renderOpcoes();
</script>
</body>
</html>
