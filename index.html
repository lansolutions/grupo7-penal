<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Extinção da Punibilidade — Vote</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#0a1628;font-family:'Segoe UI',sans-serif;color:#f1f5f9}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px}
.logo{text-align:center;padding:16px 0 20px}
.logo h1{font-size:1.1rem;font-weight:700;color:#e8b84b;letter-spacing:2px;text-transform:uppercase}
.logo p{font-size:.72rem;color:#475569;margin-top:4px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;margin-bottom:16px}
.badge{font-size:.6rem;letter-spacing:3px;text-transform:uppercase;color:#7a9bbf;margin-bottom:8px}
.pergunta{font-size:1rem;font-weight:600;color:#f1f5f9;line-height:1.5;margin-bottom:18px}
.wc-input{width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;padding:12px 14px;font-size:1rem;color:#f1f5f9;outline:none}
.wc-input:focus{border-color:#e8b84b}
.opt{width:100%;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.12);border-radius:10px;padding:13px 16px;font-size:.9rem;color:#f1f5f9;cursor:pointer;margin-bottom:10px;text-align:left;transition:all .2s}
.opt:hover,.opt.sel{border-color:#e8b84b;background:rgba(232,184,75,.1);color:#e8b84b}
.scale-wrap{display:flex;flex-direction:column;gap:10px}
.scale-labels{display:flex;justify-content:space-between;font-size:.65rem;color:#7a9bbf}
input[type=range]{width:100%;accent-color:#e8b84b;cursor:pointer}
.scale-val{text-align:center;font-size:.85rem;font-weight:700;color:#e8b84b;margin-top:4px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,#e8b84b,#d4a832);color:#0a1628;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:10px;transition:opacity .2s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.enviado-badge{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:10px;padding:10px 14px;color:#86efac;font-size:.8rem;text-align:center;margin-top:8px}
.aguarda{text-align:center;padding:50px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.aguarda .icon{font-size:3rem;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.aguarda h2{font-size:1rem;color:#e8b84b}
.aguarda p{font-size:.8rem;color:#475569}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <h1>⚖️ Extinção da Punibilidade</h1>
    <p>Grupo 7 · Direito Penal · 3º Semestre 2026/1</p>
  </div>
  <div id="app"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCcpZjXuHspxtWU5uibac7BjB9J-ye6bOk",
  authDomain: "penalgrupo7.firebaseapp.com",
  databaseURL: "https://penalgrupo7-default-rtdb.firebaseio.com",
  projectId: "penalgrupo7",
  storageBucket: "penalgrupo7.firebasestorage.app",
  messagingSenderId: "1018506558021",
  appId: "1:1018506558021:web:d8cb6a323d5eb23aee012c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const appEl = document.getElementById("app");
let perguntas = {};
let ativas = {};
let jaVotou = JSON.parse(localStorage.getItem("jaVotou") || "{}");

// Escuta perguntas
onValue(ref(db, "perguntas"), (snap) => { perguntas = snap.val() || {}; render(); });
onValue(ref(db, "ativas"), (snap) => { ativas = snap.val() || {}; render(); });

function render() {
  const ids = Object.keys(ativas).filter(id => perguntas[id]);
  if (!ids.length) {
    appEl.innerHTML = `<div class="aguarda"><div class="icon">⏳</div><h2>Aguardando perguntas...</h2><p>O professor vai liberar em breve.</p></div>`;
    return;
  }
  appEl.innerHTML = ids.map(id => renderCard(id)).join("");
}

function renderCard(id) {
  const p = perguntas[id];
  if (jaVotou[id]) {
    return `<div class="card" id="card-${id}">
      <div class="badge">${tipoLabel(p.tipo)}</div>
      <div class="pergunta">${p.texto}</div>
      <div class="enviado-badge">✅ Resposta enviada!</div>
    </div>`;
  }
  let campos = "";
  if (p.tipo === "wordcloud") {
    campos = `<input class="wc-input" id="resp-${id}" type="text" placeholder="Digite uma palavra..." maxlength="30">`;
  } else if (p.tipo === "enquete") {
    campos = (p.opcoes||[]).map((o,i) =>
      `<button class="opt" onclick="selOpt(this,'${id}',${i})">${o}</button>`
    ).join("") + `<input type="hidden" id="resp-${id}" value="">`;
  } else if (p.tipo === "escala") {
    campos = `<div class="scale-wrap">
      <div class="scale-labels"><span>${p.min_label||"Discordo totalmente"}</span><span>${p.max_label||"Concordo totalmente"}</span></div>
      <input type="range" id="resp-${id}" min="1" max="5" value="3" oninput="document.getElementById('sv-${id}').textContent=this.value">
      <div class="scale-val" id="sv-${id}">3</div>
    </div>`;
  }
  return `<div class="card" id="card-${id}">
    <div class="badge">${tipoLabel(p.tipo)}</div>
    <div class="pergunta">${p.texto}</div>
    ${campos}
    <button class="btn" onclick="enviar('${id}')">Enviar resposta</button>
  </div>`;
}

window.selOpt = (el, id, idx) => {
  document.querySelectorAll(`#card-${id} .opt`).forEach(o => o.classList.remove("sel"));
  el.classList.add("sel");
  document.getElementById("resp-"+id).value = idx;
};

window.enviar = async (id) => {
  const respEl = document.getElementById("resp-"+id);
  const val = respEl ? respEl.value : "";
  if (val === "" && perguntas[id].tipo !== "escala") return;
  const btn = document.querySelector(`#card-${id} .btn`);
  if (btn) { btn.disabled = true; btn.textContent = "Enviando..."; }
  try {
    await push(ref(db, "respostas/" + id), { valor: val || "3", ts: Date.now() });
    jaVotou[id] = true;
    localStorage.setItem("jaVotou", JSON.stringify(jaVotou));
    render();
  } catch(e) { alert("Erro ao enviar: " + e.message); if (btn) { btn.disabled = false; btn.textContent = "Enviar resposta"; } }
};

function tipoLabel(t) {
  return {wordcloud:"☁️ Nuvem de Palavras",enquete:"⚖️ Enquete",escala:"🌡️ Termômetro"}[t]||t;
}
</script>
</body>
</html>
