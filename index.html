<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votação — Extinção da Punibilidade</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#0a1628;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px}
    h1{font-size:1.3rem;font-weight:800;text-align:center;margin-bottom:4px;background:linear-gradient(135deg,#e8b84b,#4e9af1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .sub{font-size:.72rem;color:#7a9bbf;text-align:center;margin-bottom:20px;letter-spacing:1px}
    .card{background:rgba(255,255,255,.06);border:1.5px solid rgba(78,154,241,.35);border-radius:14px;padding:18px 16px;width:100%;max-width:480px;margin-bottom:16px}
    .tipo{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:#7a9bbf;margin-bottom:6px}
    .pergunta{font-size:.95rem;font-weight:600;color:#f1f5f9;line-height:1.4;margin-bottom:14px}
    /* Enquete */
    .opcoes{display:flex;flex-direction:column;gap:8px}
    .opt-btn{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:.85rem;color:#cbd5e1;transition:all .2s;text-align:left;width:100%}
    .opt-btn:hover{border-color:#4e9af1;background:rgba(78,154,241,.1)}
    .opt-btn.selected{border-color:#22c55e;background:rgba(34,197,94,.12);color:#f1f5f9;font-weight:600}
    .opt-btn.disabled{cursor:not-allowed;opacity:.7}
    .opt-btn .ico{font-size:1.1rem;flex-shrink:0}
    /* Escala */
    .scale-wrap{display:flex;flex-direction:column;gap:10px}
    .scale-labels{display:flex;justify-content:space-between;font-size:.68rem;color:#7a9bbf}
    .scale-btns{display:flex;gap:6px;justify-content:center}
    .scale-btn{flex:1;height:44px;border-radius:8px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#cbd5e1;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s}
    .scale-btn:hover{border-color:#e8b84b;background:rgba(232,184,75,.15)}
    .scale-btn.selected{border-color:#e8b84b;background:rgba(232,184,75,.25);color:#e8b84b}
    .scale-btn.disabled{cursor:not-allowed}
    /* Feedback */
    .feedback{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:.78rem;font-weight:600;display:none}
    .feedback.ok{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4);color:#86efac;display:block}
    .feedback.update{background:rgba(78,154,241,.15);border:1px solid rgba(78,154,241,.4);color:#93c5fd;display:block}
    /* Aguarda */
    .aguarda{text-align:center;padding:40px 20px;color:#475569}
    .aguarda .icon{font-size:2.5rem;margin-bottom:12px}
    /* Scrollbar */
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
    .device-id{font-size:.55rem;color:#1e3a5f;text-align:center;margin-top:24px;word-break:break-all;padding:0 20px}
  </style>
</head>
<body>
  <h1>⚖️ Extinção da Punibilidade</h1>
  <p class="sub">GRUPO 7 · DIREITO PENAL · VOTE AO VIVO</p>
  <div id="app"><div class="aguarda"><div class="icon">⏳</div><p>Carregando perguntas...</p></div></div>
  <p class="device-id" id="did-label"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCcpZjXuHspxtWU5uibac7BjB9J-ye6bOk",
  authDomain: "penalgrupo7.firebaseapp.com",
  databaseURL: "https://penalgrupo7-default-rtdb.firebaseio.com",
  projectId: "penalgrupo7",
  storageBucket: "penalgrupo7.firebasestorage.app",
  messagingSenderId: "1018506558021",
  appId: "1:1018506558021:web:d8cb6a323d5eb23aee012c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ─── DEVICE FINGERPRINT (sem cookie, sem MAC) ───────────────────────────────
async function getDeviceId() {
  const raw = [
    navigator.userAgent,
    navigator.language,
    navigator.platform || '',
    screen.width + 'x' + screen.height,
    screen.colorDepth,
    Intl.DateTimeFormat().resolvedOptions().timeZone,
    navigator.hardwareConcurrency || '',
    navigator.deviceMemory || '',
    getCanvasFingerprint()
  ].join('|');

  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('').slice(0, 32);
}

function getCanvasFingerprint() {
  try {
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '14px Arial';
    ctx.fillStyle = '#e8b84b';
    ctx.fillText('penal-grupo7-fp', 2, 2);
    return c.toDataURL().slice(-40);
  } catch { return 'no-canvas'; }
}

// ─── ESTADO ──────────────────────────────────────────────────────────────────
let perguntas = {}, ativas = {}, respostas = {}, deviceId = '';
// votos locais da sessão: { [perguntaId]: valorVotado }
// NÃO persiste entre atualizações — assim o user pode responder de novo
const votosLocais = {};

onValue(ref(db, 'perguntas'), s => { perguntas = s.val() || {}; render(); });
onValue(ref(db, 'ativas'),    s => { ativas    = s.val() || {}; render(); });
onValue(ref(db, 'respostas'), s => { respostas = s.val() || {}; render(); });

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const ids = Object.keys(ativas).filter(id => perguntas[id]);
  const app = document.getElementById('app');
  if (!ids.length) {
    app.innerHTML = '<div class="aguarda"><div class="icon">📊</div><p>Aguardando o professor ativar uma pergunta...</p></div>';
    return;
  }
  app.innerHTML = ids.map(id => renderCard(id)).join('');
}

function renderCard(id) {
  const p = perguntas[id];
  const votoAtual = respostas[id]?.[deviceId]?.valor ?? null;
  const votouNaSessao = votosLocais[id] !== undefined;
  const tipo = p.tipo;
  const tipoLabel = { enquete: '⚖️ Enquete', escala: '🌡️ Termômetro', wordcloud: '☁️ Nuvem de Palavras' }[tipo] || tipo;
  const disabled = votouNaSessao;

  let corpo = '';

  if (tipo === 'enquete') {
    const opts = p.opcoes || [];
    const icones = ['✅','❌','🔵','🟡','🟣'];
    corpo = `<div class="opcoes">${opts.map((o, i) => {
      const sel = votosLocais[id] === String(i) ? 'selected' : '';
      const dis = disabled ? 'disabled' : '';
      return `<button class="opt-btn ${sel} ${dis}" onclick="votar('${id}','${i}',this)" ${disabled?'disabled':''}>
        <span class="ico">${icones[i % icones.length]}</span><span>${o}</span>
      </button>`;
    }).join('')}</div>`;

  } else if (tipo === 'escala') {
    corpo = `<div class="scale-wrap">
      <div class="scale-labels"><span>${p.min_label||'Discordo totalmente'}</span><span>${p.max_label||'Concordo totalmente'}</span></div>
      <div class="scale-btns">${[1,2,3,4,5].map(v => {
        const sel = votosLocais[id] === String(v) ? 'selected' : '';
        const dis = disabled ? 'disabled' : '';
        return `<button class="scale-btn ${sel} ${dis}" onclick="votar('${id}','${v}',this)" ${disabled?'disabled':''}>${v}</button>`;
      }).join('')}</div>
    </div>`;

  } else if (tipo === 'wordcloud') {
    corpo = `<div class="opcoes">
      <input id="wc-${id}" type="text" maxlength="30" placeholder="Digite sua resposta..."
        style="background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;padding:10px 14px;color:#f1f5f9;font-size:.9rem;width:100%"
        ${disabled?'disabled':''}>
      ${!disabled ? `<button class="opt-btn" style="justify-content:center;margin-top:4px" onclick="votarTexto('${id}')">Enviar</button>` : ''}
    </div>`;
  }

  const feedbackMsg = votouNaSessao
    ? `✅ Resposta registrada! Atualize a página se quiser alterar.`
    : '';

  return `<div class="card">
    <div class="tipo">${tipoLabel}</div>
    <div class="pergunta">${p.texto}</div>
    ${corpo}
    <div class="feedback ok" id="fb-${id}" ${votouNaSessao?'style="display:block"':''}>${feedbackMsg}</div>
  </div>`;
}

// ─── VOTAR ───────────────────────────────────────────────────────────────────
window.votar = async function(id, valor, btn) {
  if (votosLocais[id] !== undefined) return; // já votou nesta sessão
  votosLocais[id] = String(valor);
  // Salva usando deviceId como chave → sobrescreve voto anterior do mesmo dispositivo
  await set(ref(db, `respostas/${id}/${deviceId}`), { valor: String(valor), ts: Date.now() });
  // Desabilitar botões e mostrar feedback
  document.querySelectorAll(`[onclick^="votar('${id}'"]`).forEach(b => {
    b.classList.add('disabled'); b.disabled = true;
  });
  btn.classList.add('selected');
  const fb = document.getElementById(`fb-${id}`);
  if (fb) { fb.textContent = '✅ Resposta registrada! Atualize a página se quiser alterar.'; fb.className = 'feedback ok'; }
};

window.votarTexto = async function(id) {
  if (votosLocais[id] !== undefined) return;
  const val = document.getElementById(`wc-${id}`)?.value?.trim();
  if (!val) return;
  votosLocais[id] = val;
  await set(ref(db, `respostas/${id}/${deviceId}`), { valor: val, ts: Date.now() });
  const fb = document.getElementById(`fb-${id}`);
  if (fb) { fb.textContent = '✅ Resposta registrada! Atualize a página se quiser alterar.'; fb.className = 'feedback ok'; }
  const inp = document.getElementById(`wc-${id}`);
  if (inp) inp.disabled = true;
};

// ─── INIT ────────────────────────────────────────────────────────────────────
getDeviceId().then(id => {
  deviceId = id;
  // Mostrar fragmento do ID para debug (opcional — pode remover)
  const label = document.getElementById('did-label');
  if (label) label.textContent = 'ID: ' + id.slice(0,8) + '...';
  render();
});
</script>
</body>
</html>
